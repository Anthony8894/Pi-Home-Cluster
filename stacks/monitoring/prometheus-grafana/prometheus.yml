global:
  scrape_interval: 15s

# Prometheus checks nodeexporter every 15 seconds. Adjust as needed.
# Currently monitoring two nodes. Pi-main + pi-worker.

scrape_configs:
  - job_name: 'node-exporter'
    static_configs:
      - targets:
        - '192.168.50.199:9100'
        - '192.168.50.149:9100'