services:
  traefik:
    image: traefik:v3.7.1
    container_name: traefik
    restart: unless-stopped

    command:
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"

      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"

      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"

      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=Anthonyle888@gmail.com"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"

      - "--log.level=INFO"
      - "--accesslog=true"
      - "--accesslog.filepath=/logs/access.log"

      # CrowdSec Traefik bouncer plugin
      - "--experimental.plugins.crowdsec-bouncer.modulename=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
      - "--experimental.plugins.crowdsec-bouncer.version=v1.6.0"

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - "./letsencrypt:/letsencrypt"
      - "./logs:/logs"

    networks:
      - proxy

    labels:
      - "traefik.enable=true"

      # Traefik Dashboard
      - "traefik.http.routers.traefik.rule=Host(`traefik.anthonylearchive.com`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls.certresolver=myresolver"
      - "traefik.http.routers.traefik.service=api@internal"

      # Dashboard basic auth
      # IMPORTANT: Keep $$ instead of $
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=admin:$$apr1$$iq.jYS7T$$DHNVKw0ZLBDS8FFnei2Of0"

      # CrowdSec bouncer middleware
      - "traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.enabled=true"
      - "traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.crowdsecmode=stream"
      - "traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.crowdseclapikey=[CROWDSEC_PASS_HERE]
      - "traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.crowdseclapihost=crowdsec:8080"

      # Protect Traefik dashboard with both basic auth and CrowdSec
      - "traefik.http.routers.traefik.middlewares=dashboard-auth,crowdsec-bouncer"

  whoami:
    image: traefik/whoami:latest
    container_name: whoami
    restart: unless-stopped

    networks:
      - proxy

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`whoami.anthonylearchive.com`)"
      - "traefik.http.routers.whoami.entrypoints=websecure"
      - "traefik.http.routers.whoami.tls.certresolver=myresolver"
      - "traefik.http.services.whoami.loadbalancer.server.port=80"

      # Protect whoami with both basic auth and CrowdSec
      - "traefik.http.routers.whoami.middlewares=dashboard-auth,crowdsec-bouncer"

networks:
  proxy:
    external: true
